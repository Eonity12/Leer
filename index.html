<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" href="icons/splash-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1206x2622.png" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1320x2868.png" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)">
<title>Reader</title>
<style>
:root{--bg:#0b0b10;--card:#16161f;--fg:#ececf3;--mut:#8a8aa0;--acc:#ff5a4f;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
textarea{min-height:90px}
button{font:inherit;font-size:14px;background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:9px 13px}
button.p{background:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.4}
button:active{opacity:.7}
#main{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(70px + var(--sb))}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:calc(10px + var(--st)) 12px 8px}
.top h1{margin:0;font-size:24px}
.chips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
.chips button{white-space:nowrap}.chips button.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:6px 12px 12px}
.c{background:var(--card);border-radius:10px;overflow:hidden}
.c img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.c div{padding:6px 7px;font-size:12px;height:3.6em;overflow:hidden}
.pad{padding:12px}.mut{color:var(--mut)}.sm{font-size:12px}
.fl{display:flex;gap:8px;align-items:flex-start}
.cv{width:104px;border-radius:10px;aspect-ratio:2/3;object-fit:cover;flex:none;background:#222}
.meta h2{margin:0 0 6px;font-size:18px}
.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 12px;border-bottom:1px solid #1d1d28}
.ch.read{color:var(--mut)}
.ct{display:flex;flex-direction:column;min-width:0}
.ct span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca i{font-style:normal;font-size:12px;color:var(--mut)}
h3{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input[type=checkbox]{width:22px;height:22px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
.li div{min-width:0;overflow-wrap:anywhere}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(16,16,24,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #222;padding-bottom:var(--sb)}
#tabs.hide{display:none}
#tabs button{flex:1;background:none;border-radius:0;padding:8px 0 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button.on{color:var(--acc)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#reader{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none}
#reader.pg{overflow:hidden}
#rbody.v .pi{width:100%;display:block}
#rbody .pi:not(.ld){aspect-ratio:2/3;background:#0d0d0d}
#rbody.v .end{padding:40px 20px calc(60px + var(--sb));text-align:center}
#rbody.p{height:100%;display:flex;align-items:center;justify-content:center}
#rbody.p img{max-width:100%;max-height:100%;object-fit:contain}
.msg{color:#aaa;text-align:center;padding:30vh 24px 0}
#rbar,#rpg{display:none}
body.rdr #rbar{display:flex}
body.rdr.pgm #rpg{display:block}
#rbar{position:fixed;left:0;right:0;top:0;z-index:31;align-items:center;gap:8px;padding:calc(8px + var(--st)) 10px 8px;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .2s}
#rbar.hide{transform:translateY(-115%)}
#rbar span{flex:1;text-align:center;font-size:14px}
#rpg{position:fixed;bottom:calc(8px + var(--sb));left:50%;transform:translateX(-50%);z-index:31;background:rgba(0,0,0,.6);padding:3px 12px;border-radius:12px;font-size:12px;color:#ccc}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translateX(-50%);background:#2a2a38;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center;font-size:14px}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="main"></div>
<nav id="tabs">
  <button data-t="browse"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Browse</button>
  <button data-t="lib"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Library</button>
  <button data-t="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<div id="reader"><div id="rbody"></div></div>
<div id="rbar" class="hide"><button id="rx">✕</button><span id="rt"></span><button id="rp">‹</button><button id="rn">›</button></div>
<div id="rpg"></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};

/* ---------- state ---------- */
let lib=ld('lib',{}), prog=ld('prog',{});
let cfg=Object.assign({mode:'vertical',saver:true,lists:[],proxy:''},ld('cfg',{}));
let tab='browse', sel='md', q='', browseRes=null, browseKey='';
let cur=null, curChs=[], curState='loading', curErr='', desc=true;
let inDetail=false, inReader=false, rd=null, scrollSave=0, lastTop=0, barT=0;
const main=$('#main');
const keyOf=m=>m.src+'|'+m.id;
let sp; const saveProg=()=>{clearTimeout(sp);sp=setTimeout(()=>sv('prog',prog),400)};
const flush=()=>{clearTimeout(sp);sv('prog',prog)};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
let tt; function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
async function jget(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('reply was not JSON ('+t.slice(0,40).replace(/\s+/g,' ')+'…)')}}
/* MangaDex only allows third-party apps through their own relay (see relay/RELAY.md) */
const isMD=u=>/^https:\/\/([^/]*\.)?mangadex\.(org|network)(:\d+)?(\/|$)/.test(u);
const px=u=>(cfg.proxy&&isMD(u))?cfg.proxy.replace(/\/+$/,'')+'/?url='+encodeURIComponent(u):u;
const rp=u=>px(u)!==u?'origin':'no-referrer';
const mdget=u=>{if(!cfg.proxy)throw new Error('MangaDex needs the relay. Add its URL in Settings.');return jget(px(u))};

/* ---------- sources ---------- */
const MD='https://api.mangadex.org';
const RAT='&contentRating[]=safe&contentRating[]=suggestive';
const mdCover=m=>{const r=m.relationships.find(x=>x.type==='cover_art');const f=r&&r.attributes&&r.attributes.fileName;return f?`https://uploads.mangadex.org/covers/${m.id}/${f}.256.jpg`:''};
const mdTitle=m=>m.attributes.title.en||Object.values(m.attributes.title)[0]||'Untitled';
const mdMini=m=>({src:'md',id:m.id,t:mdTitle(m),c:mdCover(m),d:(m.attributes.description&&m.attributes.description.en)||''});
const MDX={
  async popular(){const d=await mdget(`${MD}/manga?limit=30&includes[]=cover_art${RAT}&order[followedCount]=desc&hasAvailableChapters=true&availableTranslatedLanguage[]=en`);return d.data.map(mdMini)},
  async search(s){const d=await mdget(`${MD}/manga?title=${encodeURIComponent(s)}&limit=30&includes[]=cover_art${RAT}&order[relevance]=desc`);return d.data.map(mdMini)},
  async chapters(m){
    let all=[],off=0,tot=1;
    while(off<tot&&off<3000){const d=await mdget(`${MD}/manga/${m.id}/feed?translatedLanguage[]=en&order[chapter]=asc&limit=500&offset=${off}&includeExternalUrl=0${RAT}`);all=all.concat(d.data);tot=d.total;off+=500}
    const seen=new Set();
    return all.filter(c=>c.attributes.pages>0).filter(c=>{const k=c.attributes.chapter||c.id;if(seen.has(k))return false;seen.add(k);return true})
      .map(c=>({id:c.id,n:c.attributes.chapter||'',v:c.attributes.volume||'',t:c.attributes.title||''}));
  },
  async pages(m,c){
    const d=await mdget(`${MD}/at-home/server/${c.id}`);
    const dir=cfg.saver?'data-saver':'data', arr=cfg.saver?d.chapter.dataSaver:d.chapter.data;
    return arr.map(f=>`${d.baseUrl}/${dir}/${d.chapter.hash}/${f}`);
  }
};
function normUrl(u){
  u=u.trim(); let m;
  if((m=u.match(/^([\w.-]+)\/([\w.-]+)$/)))return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/main/sources.json`;
  if((m=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/)))return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  if((m=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+?)(?:\.git)?\/?$/)))return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/main/sources.json`;
  return u;
}
function listSource(url){
  const id='l:'+url;
  const abs=(x,b)=>{try{return new URL(x,b||url).href}catch(e){return x}};
  const all=async()=>{const d=await jget(url,{cache:'no-cache'});return d.series||d.manga||[]};
  const mini=(arr)=>arr.map((s,i)=>({src:id,id:String(s.id!=null?s.id:i),t:s.title||s.name||'Untitled',c:s.cover?abs(s.cover):'',d:s.description||''}));
  return {
    async popular(){return mini(await all())},
    async search(s){s=s.toLowerCase();return mini(await all()).filter(m=>m.t.toLowerCase().includes(s))},
    async chapters(m){
      const arr=await all(); const s=arr.find((x,i)=>String(x.id!=null?x.id:i)===m.id);
      if(!s)throw new Error('Series not found in list');
      let chs=s.chapters, base=url;
      if(!chs&&s.chaptersUrl){base=abs(s.chaptersUrl);const r=await jget(base);chs=Array.isArray(r)?r:r.chapters}
      return (chs||[]).map((c,i)=>({id:String(c.id!=null?c.id:i),n:String(c.number!=null?c.number:(c.chapter!=null?c.chapter:i+1)),v:c.volume?String(c.volume):'',t:c.title||'',
        _p:c.pages?c.pages.map(p=>abs(p,base)):null,_u:c.pagesUrl?abs(c.pagesUrl,base):null}));
    },
    async pages(m,c){
      if(c._p)return c._p;
      if(c._u){const r=await jget(c._u);const a=Array.isArray(r)?r:r.pages;return a.map(p=>abs(p,c._u))}
      throw new Error('Chapter has no pages');
    }
  };
}
const srcById=id=>id==='md'?MDX:listSource(id.slice(2));
const sources=()=>[{id:'md',name:'MangaDex'}].concat(cfg.lists.map(l=>({id:'l:'+l.url,name:l.name})));
const sortCh=a=>a.sort((x,y)=>(parseFloat(x.n)||0)-(parseFloat(y.n)||0));

/* ---------- views ---------- */
function render(){
  $('#tabs').classList.toggle('hide',inDetail||inReader);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='browse')viewBrowse();else if(tab==='lib')viewLib();else viewSettings();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();main.scrollTop=0});

const grid=l=>l.length?`<div class="grid">${l.map((m,i)=>`<div class="c" data-i="${i}"><img loading="lazy" referrerpolicy="${rp(m.c)}" src="${esc(px(m.c))}" alt=""><div>${esc(m.t)}</div></div>`).join('')}</div>`:'<p class="pad mut">Nothing found.</p>';
const bindGrid=l=>main.querySelectorAll('.c').forEach(e=>e.onclick=()=>openDetail(l[+e.dataset.i]));

async function viewBrowse(){
  const ss=sources(); if(!ss.some(s=>s.id===sel))sel='md';
  const name=ss.find(s=>s.id===sel).name;
  main.innerHTML=`<div class="top"><input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" placeholder="Search ${esc(name)}…" value="${esc(q)}"></div>
  <div class="chips">${ss.map(s=>`<button data-s="${esc(s.id)}" class="${s.id===sel?'on':''}">${esc(s.name)}</button>`).join('')}</div><div id="out"></div>`;
  main.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{sel=b.dataset.s;browseKey='';viewBrowse()});
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){q=e.target.value.trim();e.target.blur();viewBrowse()}});
  const out=$('#out'), key=sel+'|'+q;
  if(browseKey===key&&browseRes){out.innerHTML=grid(browseRes);bindGrid(browseRes);return}
  out.innerHTML='<p class="pad mut">Loading…</p>';
  try{
    const s=srcById(sel), r=q?await s.search(q):await s.popular();
    if(!out.isConnected)return;
    browseRes=r;browseKey=key;out.innerHTML=grid(r);bindGrid(r);
  }catch(e){if(out.isConnected)out.innerHTML=`<p class="pad">Couldn't reach the source (${esc(e.message)}).</p>`}
}

function viewLib(){
  const l=Object.values(lib).sort((a,b)=>(b.ts||0)-(a.ts||0)||a.t.localeCompare(b.t));
  main.innerHTML=`<div class="top"><h1>Library</h1></div>`+(l.length?grid(l):'<p class="pad mut">Nothing saved yet. Open a series and tap “+ Library”.</p>');
  bindGrid(l);
}

function nextUp(m,chs){
  const p=prog[keyOf(m)]||{}; let i=chs.findIndex(c=>c.id===p._last);
  if(i<0){i=chs.findIndex(c=>!(p[c.id]&&p[c.id].done));return i<0?0:i}
  if(!(p[chs[i].id]&&p[chs[i].id].done))return i;
  return Math.min(i+1,chs.length-1);
}

function openDetail(m,push=true){
  cur=m;inDetail=true;scrollSave=main.scrollTop;
  if(push)history.pushState({d:1},'');
  $('#tabs').classList.add('hide');
  loadDetail();
}
async function loadDetail(){
  const m=cur; curChs=[];curState='loading';drawDetail();main.scrollTop=0;
  try{
    const chs=sortCh(await srcById(m.src).chapters(m));
    if(cur!==m)return; curChs=chs;curState='ok';
  }catch(e){if(cur!==m)return;curState='err';curErr=e.message}
  drawDetail();
}
function drawDetail(){
  const m=cur; if(!m)return;
  const key=keyOf(m), inL=!!lib[key], P=prog[key]||{}, st=main.scrollTop;
  $('#tabs').classList.add('hide');
  let body;
  if(curState==='loading')body='<p class="pad mut">Loading chapters…</p>';
  else if(curState==='err')body=`<p class="pad">Couldn't load chapters (${esc(curErr)}).</p><div class="pad"><button id="retry">Retry</button></div>`;
  else if(!curChs.length)body='<p class="pad mut">No readable chapters.</p>';
  else{
    const order=curChs.map((_,i)=>i); if(desc)order.reverse();
    body=order.map(i=>{const c=curChs[i],p=P[c.id]||{};
      return `<div class="ch${p.done?' read':''}" data-i="${i}"><div class="ct"><b>${c.v?'Vol '+esc(c.v)+' · ':''}Ch ${esc(c.n||'—')}</b>${c.t?`<span>${esc(c.t)}</span>`:''}</div><div class="ca">${p.done?'<i>✓ read</i>':(p.i?`<i>p.${p.i+1}</i>`:'')}</div></div>`}).join('');
  }
  const nu=curChs.length?nextUp(m,curChs):-1;
  main.innerHTML=`<div class="top"><button id="bk">‹ Back</button></div>
  <div class="pad"><div class="fl"><img class="cv" referrerpolicy="${rp(m.c)}" src="${esc(px(m.c))}" alt=""><div class="meta"><h2>${esc(m.t)}</h2><p class="mut sm clamp">${esc((m.d||'').slice(0,500))}</p></div></div>
  <div class="row" style="margin-top:12px"><button class="p" id="go" ${nu<0?'disabled':''}>${P._last&&nu>=0?'Continue · Ch '+esc(curChs[nu].n||'—'):'Start reading'}</button><button id="sv">${inL?'In library ✓':'+ Library'}</button><button id="so">${desc?'Newest ↓':'Oldest ↑'}</button></div></div>${body}`;
  main.scrollTop=st;
  $('#bk').onclick=()=>history.back();
  $('#sv').onclick=()=>{if(lib[key])delete lib[key];else lib[key]={key,src:m.src,id:m.id,t:m.t,c:m.c,d:m.d,ts:Date.now()};sv('lib',lib);drawDetail()};
  $('#so').onclick=()=>{desc=!desc;drawDetail()};
  const go=$('#go'); if(go)go.onclick=()=>openReader(m,curChs,nu,true);
  const rt=$('#retry'); if(rt)rt.onclick=loadDetail;
  main.querySelectorAll('.ch').forEach(e=>e.onclick=()=>openReader(m,curChs,+e.dataset.i,true));
}

/* ---------- reader ---------- */
function imgErr(im){
  const n=+(im.dataset.r||0);
  if(n<2){im.dataset.r=n+1;setTimeout(()=>{const s=im.getAttribute('src');im.removeAttribute('src');im.setAttribute('src',s)},1200*(n+1))}
  else im.classList.add('err');
}
async function openReader(m,chs,i,push){
  const c=chs[i], key=keyOf(m), tok={};
  rd={m,chs,i,c,pages:[],idx:0,tok,mode:cfg.mode==='vertical'?'v':'p',rtl:cfg.mode==='rtl'};
  const stale=()=>!rd||rd.tok!==tok;
  inReader=true;
  document.body.classList.add('rdr');document.body.classList.toggle('pgm',rd.mode==='p');
  $('#tabs').classList.add('hide');
  const R=$('#reader'); R.style.display='block'; R.classList.toggle('pg',rd.mode==='p'); R.scrollTop=0;
  if(push)history.pushState({r:1},'');
  $('#rt').textContent=`${c.v?'Vol '+c.v+' · ':''}Ch ${c.n||'—'}`;
  $('#rbar').classList.remove('hide');clearTimeout(barT);barT=setTimeout(()=>$('#rbar').classList.add('hide'),2500);
  const body=$('#rbody'); body.className=rd.mode; body.innerHTML='<p class="msg">Loading pages…</p>';
  const P=(prog[key]=prog[key]||{}); P._last=c.id; const p=(P[c.id]=P[c.id]||{});
  if(lib[key]){lib[key].ts=Date.now();sv('lib',lib)}
  saveProg();
  let pages;
  try{pages=await srcById(m.src).pages(m,c)}
  catch(e){if(!stale())body.innerHTML=`<p class="msg">Couldn't load this chapter.<br><span class="sm">${esc(e.message)}</span></p>`;return}
  if(stale())return;
  if(!pages.length){body.innerHTML='<p class="msg">This chapter has no pages.</p>';return}
  rd.pages=pages;
  const start=p.done?0:Math.min(p.i||0,pages.length-1);
  if(rd.mode==='v'){
    body.innerHTML=pages.map((u,j)=>`<img class="pi" referrerpolicy="${rp(u)}" ${j>start+1?'loading="lazy"':''} onload="this.classList.add('ld')" onerror="imgErr(this)" src="${esc(px(u))}" alt="">`).join('')
      +`<div class="end"><button class="p" id="nx">${i+1<chs.length?'Next chapter ›':'Back to series'}</button></div>`;
    R.scrollTop=(start&&body.children[start])?body.children[start].offsetTop:0; lastTop=R.scrollTop;
  }else{
    body.innerHTML='<img id="pimg" class="pi" referrerpolicy="no-referrer" onload="this.classList.add(\'ld\')" onerror="imgErr(this)" alt="">';
    showP(start);
  }
}
function showP(j){
  rd.idx=j; const img=$('#pimg');
  img.classList.remove('ld'); img.removeAttribute('data-r'); img.classList.remove('err'); img.referrerPolicy=rp(rd.pages[j]); img.src=px(rd.pages[j]);
  $('#rpg').textContent=`${j+1} / ${rd.pages.length}`;
  [1,2].forEach(k=>{if(rd.pages[j+k]){const u=rd.pages[j+k],im=new Image();im.referrerPolicy=rp(u);im.src=px(u)}});
  const key=keyOf(rd.m), p=prog[key][rd.c.id]; p.i=j; p.n=rd.pages.length; if(j>=rd.pages.length-1)p.done=1; saveProg();
}
function step(d){
  const j=rd.idx+d;
  if(j>=rd.pages.length)nextCh(); else if(j<0)prevCh(); else showP(j);
}
function nextCh(){if(rd.i+1<rd.chs.length)openReader(rd.m,rd.chs,rd.i+1,false);else{toast('That was the last chapter');if(rd.mode==='v')history.back()}}
function prevCh(){if(rd.i>0)openReader(rd.m,rd.chs,rd.i-1,false);else toast('First chapter')}
function closeReader(){
  inReader=false;rd=null;flush();
  $('#reader').style.display='none';$('#rbody').innerHTML='';
  document.body.classList.remove('rdr','pgm');
  if(inDetail)drawDetail();else render();
}
function trackV(){
  if(!rd||rd.mode!=='v')return;
  const R=$('#reader'), imgs=$('#rbody').querySelectorAll('.pi'), st=R.scrollTop; let idx=0;
  for(let j=0;j<imgs.length;j++){idx=j;if(imgs[j].offsetTop+imgs[j].offsetHeight>st+40)break}
  const P=prog[keyOf(rd.m)], p=P[rd.c.id];
  p.i=idx;p.n=imgs.length;
  if(st+R.clientHeight>=R.scrollHeight-150)p.done=1;
  saveProg();
  if(st>lastTop+8)$('#rbar').classList.add('hide');else if(st<lastTop-8)$('#rbar').classList.remove('hide');
  lastTop=st;
}
let tick=false;
$('#reader').addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;trackV()})},{passive:true});
$('#reader').addEventListener('click',e=>{
  if(!rd)return;
  if(e.target.id==='nx'){nextCh();return}
  if(rd.mode==='v'){$('#rbar').classList.toggle('hide');return}
  const x=e.clientX/innerWidth;
  if(x<.3)step(rd.rtl?1:-1);else if(x>.7)step(rd.rtl?-1:1);else $('#rbar').classList.toggle('hide');
});
$('#rx').onclick=()=>history.back();
$('#rp').onclick=()=>rd&&prevCh();
$('#rn').onclick=()=>rd&&nextCh();

/* navigation: system back + edge swipe */
addEventListener('popstate',()=>{
  if(inReader){closeReader();return}
  if(inDetail){inDetail=false;cur=null;render();main.scrollTop=scrollSave}
});
let t0=null;
addEventListener('touchstart',e=>{const t=e.touches[0];t0=e.touches.length===1?{x:t.clientX,y:t.clientY}:null},{passive:true});
addEventListener('touchend',e=>{
  if(!t0)return; const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,s=t0; t0=null;
  if(Math.abs(dy)>60)return;
  if(window.visualViewport&&window.visualViewport.scale>1.05)return;
  if(s.x<24&&dx>80&&(inDetail||inReader)){history.back();return}
  if(inReader&&rd&&rd.mode==='p'&&rd.pages.length&&s.x>=24&&Math.abs(dx)>60)step(((rd.rtl?dx>0:dx<0))?1:-1);
},{passive:true});

/* ---------- settings ---------- */
async function addList(raw){
  const url=normUrl(raw); if(!raw.trim())return;
  if(cfg.lists.some(l=>l.url===url))return toast('Already added');
  try{
    const d=await jget(url,{cache:'no-cache'});
    if(!(d.series||d.manga))throw new Error('no "series" array found');
    const name=d.name||(url.split('/').slice(3,5).join('/'))||url;
    cfg.lists.push({url,name});sv('cfg',cfg);toast('Added '+name);viewSettings();
  }catch(e){toast('Could not load list: '+e.message)}
}
function viewSettings(){
  main.innerHTML=`<div class="top"><h1>Settings</h1></div><div class="pad">
  <h3>Reading</h3>
  <select id="s-mode"><option value="vertical">Vertical scroll (webtoon)</option><option value="rtl">Paged · right-to-left (manga)</option><option value="ltr">Paged · left-to-right</option></select>
  <label class="row"><input type="checkbox" id="s-saver"> Data-saver images (MangaDex)</label>
  <h3>MangaDex relay</h3>
  <p class="mut sm">MangaDex only works through a relay you host (free). See relay/RELAY.md in the repo. Paste its address here.</p>
  <div class="row"><input id="s-px" placeholder="https://leer-relay.yourname.workers.dev" value="${esc(cfg.proxy||'')}" autocapitalize="none" autocorrect="off"><button class="p" id="s-pxs">Save</button></div>
  <div class="row"><button id="s-pxt">Test connection</button></div>
  <h3>Source lists</h3>
  <p class="mut sm">Paste a GitHub link to a JSON list, or <b>user/repo</b> to load that repo's sources.json.</p>
  <div class="row"><input id="s-url" placeholder="user/repo or JSON URL" autocapitalize="none" autocorrect="off"><button class="p" id="s-add">Add</button></div>
  ${cfg.lists.map((l,i)=>`<div class="li"><div><b>${esc(l.name)}</b><br><span class="mut sm">${esc(l.url)}</span></div><button class="rm" data-i="${i}">Remove</button></div>`).join('')}
  <h3>Backup</h3>
  <p class="mut sm">Copies your library, progress and settings as text. Paste it back here to restore.</p>
  <div class="row"><button id="s-copy">Copy backup</button><button id="s-rest">Restore</button></div>
  <textarea id="s-box" placeholder="Paste backup here to restore" autocapitalize="none" autocorrect="off"></textarea>
  <h3>App</h3>
  <div class="row"><button id="s-reload">Reload app</button></div>
  <p class="mut sm" id="s-info"></p></div>`;
  $('#s-mode').value=cfg.mode; $('#s-saver').checked=!!cfg.saver;
  $('#s-mode').onchange=e=>{cfg.mode=e.target.value;sv('cfg',cfg)};
  $('#s-saver').onchange=e=>{cfg.saver=e.target.checked;sv('cfg',cfg)};
  $('#s-pxs').onclick=()=>{
    let v=$('#s-px').value.replace(/\s+/g,'');
    if(v){
      if(!/^https?:\/\//i.test(v))v='https://'+v;
      try{const u=new URL(v);if(!u.hostname.includes('.'))throw new Error('x');v=u.origin}
      catch(e){return toast('That doesn’t look like a web address. Paste the full https://… address')}
    }
    cfg.proxy=v;sv('cfg',cfg);browseKey='';$('#s-px').value=v;toast(v?'Relay saved':'Relay cleared');
  };
  $('#s-pxt').onclick=async()=>{
    if(!cfg.proxy)return toast('Save a relay URL first');
    try{const r=await fetch(px('https://api.mangadex.org/ping')),t=await r.text();toast(r.ok&&/pong/i.test(t)?'Relay works ✓':'Relay replied '+r.status+': '+t.slice(0,40).replace(/\s+/g,' '))}
    catch(e){toast('Relay unreachable: '+e.message)}
  };
  $('#s-add').onclick=()=>addList($('#s-url').value);
  $('#s-url').addEventListener('keydown',e=>{if(e.key==='Enter')addList(e.target.value)});
  main.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const l=cfg.lists.splice(+b.dataset.i,1)[0];if(sel==='l:'+l.url){sel='md';browseKey=''}sv('cfg',cfg);viewSettings()});
  $('#s-copy').onclick=async()=>{
    const txt=JSON.stringify({v:1,lib,prog,cfg});
    try{await navigator.clipboard.writeText(txt);toast('Backup copied')}catch(e){$('#s-box').value=txt;$('#s-box').select();toast('Copy the text below manually')}
  };
  $('#s-rest').onclick=()=>{
    try{
      const b=JSON.parse($('#s-box').value);
      if(!b||!b.lib)throw new Error('not a backup');
      Object.assign(lib,b.lib);
      for(const k in (b.prog||{}))prog[k]=Object.assign({},prog[k],b.prog[k]);
      for(const l of ((b.cfg&&b.cfg.lists)||[]))if(!cfg.lists.some(x=>x.url===l.url))cfg.lists.push(l);
      sv('lib',lib);sv('prog',prog);sv('cfg',cfg);toast('Backup restored');viewSettings();
    }catch(e){toast('Restore failed: '+e.message)}
  };
  $('#s-reload').onclick=()=>location.reload();
  $('#s-info').textContent=`${Object.keys(lib).length} saved series`;
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(s=>{const e=$('#s-info');if(e&&s.usage!=null)e.textContent+=` · ${(s.usage/1048576).toFixed(1)} MB used`}).catch(()=>{});
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();
</script>
</body>
